<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f2f5;
      color: #1f2328;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      background: #1f2328;
      color: #fff;
      padding: 0 1rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .02em; }
    #model-select {
      background: #2d333b;
      color: #cdd9e5;
      border: 1px solid #444c56;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: .85rem;
      cursor: pointer;
      outline: none;
    }

    /* ── Chat window ── */
    #chat-window {
      flex: 1;
      width: 100%;
      max-width: 760px;
      overflow-y: auto;
      padding: 1.5rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .bubble-row {
      display: flex;
      gap: .6rem;
      align-items: flex-end;
    }
    .bubble-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      color: #fff;
    }
    .avatar.assistant { background: #3b82d4; }
    .avatar.user       { background: #7c5cd8; }

    .bubble {
      max-width: 72%;
      padding: .6rem .9rem;
      border-radius: 14px;
      line-height: 1.6;
      font-size: .92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.assistant {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: #7c5cd8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* typing dots */
    .typing-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      margin: 0 2px;
      background: #aaa;
      border-radius: 50%;
      animation: blink 1.2s infinite both;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .2; transform: scale(.8); }
      40%           { opacity: 1;  transform: scale(1);   }
    }

    .error-msg {
      color: #d73a49;
      font-size: .85rem;
      text-align: center;
      padding: .4rem;
    }

    /* ── Input bar ── */
    #input-area {
      width: 100%;
      max-width: 760px;
      padding: .75rem 1rem 1rem;
      display: flex;
      gap: .5rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      padding: .6rem .85rem;
      font-size: .95rem;
      font-family: inherit;
      line-height: 1.5;
      outline: none;
      max-height: 160px;
      overflow-y: auto;
      background: #fff;
      transition: border-color .15s;
    }
    #user-input:focus { border-color: #3b82d4; }
    #user-input::placeholder { color: #8c959f; }

    #send-btn {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border: none;
      border-radius: 10px;
      background: #3b82d4;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, opacity .15s;
    }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #2563c4; }
    #send-btn svg { width: 18px; height: 18px; fill: currentColor; }

    #clear-btn {
      flex-shrink: 0;
      height: 40px;
      padding: 0 .8rem;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #fff;
      color: #57606a;
      font-size: .82rem;
      cursor: pointer;
      transition: background .15s;
    }
    #clear-btn:hover { background: #f6f8fa; }
  </style>
</head>
<body>

<header>
  <h1>&#129302; AI Chatbot</h1>
  <select id="model-select" title="Choose model" aria-label="Choose model"></select>
</header>

<div id="chat-window" role="log" aria-live="polite" aria-label="Chat messages"></div>

<div id="input-area">
  <textarea
    id="user-input"
    rows="1"
    placeholder="Type a message…"
    aria-label="Message input"
  ></textarea>
  <button id="clear-btn" title="Clear conversation">Clear</button>
  <button id="send-btn" title="Send message" aria-label="Send">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
  const chatWindow  = document.getElementById("chat-window");
  const userInput   = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const clearBtn    = document.getElementById("clear-btn");
  const modelSelect = document.getElementById("model-select");

  let conversationHistory = [];
  let isStreaming = false;

  // ── Helpers ────────────────────────────────────────────────────────────────

  function scrollToBottom() {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function createBubble(role) {
    const row    = document.createElement("div");
    row.className = `bubble-row ${role}`;

    const avatar  = document.createElement("div");
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === "user" ? "You" : "AI";

    const bubble  = document.createElement("div");
    bubble.className = `bubble ${role}`;

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function showTyping() {
    const bubble = createBubble("assistant");
    bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    return bubble;
  }

  function showError(msg) {
    const div = document.createElement("div");
    div.className = "error-msg";
    div.textContent = msg;
    chatWindow.appendChild(div);
    scrollToBottom();
  }

  function autoResize() {
    userInput.style.height = "auto";
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + "px";
  }

  // ── Load models ─────────────────────────────────────────────────────────────

  async function loadModels() {
    try {
      const res  = await fetch("/api/models");
      const data = await res.json();
      if (!res.ok || !data.models) throw new Error(data.error || "Unknown error");
      data.models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      });
    } catch (err) {
      const opt = document.createElement("option");
      opt.textContent = "Could not load models";
      opt.disabled = true;
      modelSelect.appendChild(opt);
    }
  }

  // ── Send message ────────────────────────────────────────────────────────────

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;

    // Show user bubble
    const userBubble = createBubble("user");
    userBubble.textContent = text;
    userInput.value = "";
    autoResize();

    conversationHistory.push({ role: "user", content: text });

    // Show typing indicator
    const assistantBubble = showTyping();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: modelSelect.value,
          messages: conversationHistory,
        }),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${response.status}`);
      }

      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = "";
      let   fullReply = "";
      let   firstChunk = true;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let chunk;
          try { chunk = JSON.parse(raw); } catch { continue; }

          if (chunk.error) { throw new Error(chunk.error); }

          if (firstChunk) {
            assistantBubble.textContent = "";
            firstChunk = false;
          }

          fullReply += chunk.content;
          assistantBubble.textContent = fullReply;
          scrollToBottom();

          if (chunk.done) break;
        }
      }

      conversationHistory.push({ role: "assistant", content: fullReply });

    } catch (err) {
      assistantBubble.closest(".bubble-row")?.remove();
      showError(`Error: ${err.message}`);
      // Roll back the user turn from history
      conversationHistory.pop();
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  // ── Clear ───────────────────────────────────────────────────────────────────

  clearBtn.addEventListener("click", () => {
    conversationHistory = [];
    chatWindow.innerHTML = "";
  });

  // ── Events ──────────────────────────────────────────────────────────────────

  sendBtn.addEventListener("click", sendMessage);

  userInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener("input", autoResize);

  // ── Init ────────────────────────────────────────────────────────────────────
  loadModels();
  userInput.focus();
</script>
</body>
</html>
